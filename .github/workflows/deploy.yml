name: Build, Version & Deploy KekeGo to Firebase

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Release notes description'
        required: false
        default: 'Automated fleet update with real-time transit radar'

jobs:
  build-and-deploy:
    name: Build & Deploy to Firebase Storage and Distribution
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set Dynamic Version & Build Numbers
        id: versioning
        run: |
          BUILD_NUM=${{ github.run_number }}
          VERSION_TAG="1.0.${BUILD_NUM}"
          echo "BUILD_NUMBER=${BUILD_NUM}" >> $GITHUB_ENV
          echo "APP_VERSION_NAME=${VERSION_TAG}" >> $GITHUB_ENV
          echo "build_num=${BUILD_NUM}" >> $GITHUB_OUTPUT
          echo "version_tag=${VERSION_TAG}" >> $GITHUB_OUTPUT
          echo "Building KekeGo Version: ${VERSION_TAG} (Build #${BUILD_NUM})"

      - name: Run Unit Tests & Lint Quality Gate
        run: gradle :app:testDebugUnitTest

      - name: Decode Release Keystore (Optional if provided in Secrets)
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "${KEYSTORE_BASE64}" | base64 --decode > "${{ github.workspace }}/my-upload-key.jks"
          echo "KEYSTORE_PATH=${{ github.workspace }}/my-upload-key.jks" >> $GITHUB_ENV

      - name: Assemble Release APK
        env:
          BUILD_NUMBER: ${{ steps.versioning.outputs.build_num }}
          APP_VERSION_NAME: ${{ steps.versioning.outputs.version_tag }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # If no custom release key provided, assemble debug-signed universal APK for easy installation
          if [ -z "${{ secrets.STORE_PASSWORD }}" ]; then
            echo "No custom keystore password detected; generating release APK with standard verification..."
            gradle :app:assembleDebug
            mkdir -p app/build/outputs/apk/release
            cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/release/kekego-v${{ steps.versioning.outputs.version_tag }}.apk
          else
            gradle :app:assembleRelease
            mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/kekego-v${{ steps.versioning.outputs.version_tag }}.apk || true
          fi

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kekego-v${{ steps.versioning.outputs.version_tag }}-apk
          path: app/build/outputs/apk/*/*.apk
          retention-days: 30

      # -----------------------------------------------------------
      # TARGET 1: DEPLOY DIRECTLY TO FIREBASE CLOUD STORAGE BUCKET
      # -----------------------------------------------------------
      - name: Authenticate to Google Cloud for Firebase Storage
        if: env.GCP_SA_KEY != ''
        uses: google-github-actions/auth@v2
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Upload APK directly to Firebase Storage Bucket
        if: env.GCP_SA_KEY != ''
        uses: google-github-actions/upload-cloud-storage@v2
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        with:
          path: app/build/outputs/apk/release/kekego-v${{ steps.versioning.outputs.version_tag }}.apk
          destination: gen-lang-client-0639805966.appspot.com/builds/
          parent: false

      # -----------------------------------------------------------
      # TARGET 2: DEPLOY TO FIREBASE APP DISTRIBUTION
      # -----------------------------------------------------------
      - name: Deploy APK to Firebase App Distribution
        if: env.FIREBASE_APP_ID != ''
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        env:
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.GCP_SA_KEY }}
          groups: testers, fleet-drivers
          file: app/build/outputs/apk/release/kekego-v${{ steps.versioning.outputs.version_tag }}.apk
          releaseNotes: |
            KekeGo Build #${{ steps.versioning.outputs.build_num }} (v${{ steps.versioning.outputs.version_tag }})
            - 3D Cityscape transit map & live keke fleet
            - In-app trip chat, calling & dispatch chimes
            - Multi-category ride tiers & saved places
            ${{ github.event.inputs.release_notes }}
